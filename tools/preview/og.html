<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>og</title>
<style>body{margin:0;background:#ccc;font-family:sans-serif}canvas{display:block;margin:8px;box-shadow:0 0 0 1px #000;max-width:95vw;height:auto}</style></head><body>
<canvas id="og" width="1200" height="630"></canvas>
<script>
// SNS で共有されたときの画像（1200×630）。白地に墨の文字と、ロゴの印（赤と青が重なって紫）。面をグラデーションで塗らない（DESIGN.md §1）。
// 先に npm run build（見出しの書体 dist/fonts/heading-*.woff2 を使う）→ python3 tools/preview/serve.py →
// このページを ?auto=1 で開くと描いて tools/preview/out/og.jpg に保存する → public/og.jpg へ手で移す
const HEADING = '"Eleanor Heading", "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif';
const BODY = '"Noto Sans JP", "Hiragino Sans", "BIZ UDPGothic", "Yu Gothic UI", Meiryo, sans-serif';
const INK = '#1a1a1a', MID = '#4d4d4d', RULE = '#949494';

async function loadHeadingFont() {
  // 書体のファイル名はビルドごとに変わるので、トップページの preload から拾う
  const html = await (await fetch('/')).text();
  const href = html.match(/<link rel="preload" href="([^"]+\.woff2)"/)?.[1];
  if (!href) return 'no heading font';
  const face = new FontFace('Eleanor Heading', `url(${href})`, { weight: '700' });
  document.fonts.add(await face.load());
  return href;
}

function mark(c, x, y, s) {
  // src/components/LogoMark.astro と同じ形（32 の格子）
  c.fillStyle = '#d7263d'; c.fillRect(x + 2 * s, y + 8 * s, 20 * s, 22 * s);
  c.fillStyle = '#1f4fd1'; c.fillRect(x + 10 * s, y + 2 * s, 20 * s, 20 * s);
  c.fillStyle = '#7b3a87'; c.fillRect(x + 10 * s, y + 8 * s, 12 * s, 14 * s);
}

async function draw() {
  const font = await loadHeadingFont();
  await document.fonts.ready;
  const c = document.getElementById('og').getContext('2d');
  c.fillStyle = '#ffffff'; c.fillRect(0, 0, 1200, 630);
  mark(c, 88, 72, 2.5);
  c.fillStyle = INK; c.textBaseline = 'alphabetic';
  c.font = `700 44px ${HEADING}`; c.fillText('エレノア', 184, 132);
  c.fillStyle = MID; c.font = `400 26px ${BODY}`; c.fillText('Eleanor', 392, 130);
  // 看板。行頭の始め括弧は二分ぶら下げ、「」。」は二分詰める（サイトは見出しの palt で詰まる。canvas では効かないので手で合わせる）
  c.fillStyle = INK; c.font = `700 100px ${HEADING}`;
  const em = 100, x0 = 88;
  let x = x0 - em / 2;
  for (const [ch, adv] of [['「', 1], ['つくって終わり', null], ['」', 0.5], ['。', 1]]) {
    c.fillText(ch, x, 330);
    x += adv === null ? c.measureText(ch).width : adv * em;
  }
  // 2 行目の読点も二分詰める（canvas では palt が効かないので、サイトの見出しと同じ詰め方を手で合わせる）
  x = x0;
  for (const [ch, adv] of [['に', null], ['、', 0.5], ['しない。', null]]) {
    c.fillText(ch, x, 450);
    x += adv === null ? c.measureText(ch).width : adv * em;
  }
  c.fillStyle = MID; c.font = `700 36px ${HEADING}`;
  c.fillText('東京・新宿のホームページ・LP 制作と保守', x0, 540);
  c.fillStyle = RULE; c.fillRect(x0, 568, 1024, 1);
  c.fillStyle = INK; c.font = `700 28px ${BODY}`; c.textAlign = 'right'; c.fillText('eleanor-dev.com', 1112, 540);
  c.textAlign = 'left';
  return 'drawn with ' + font;
}
async function save() {
  const blob = await new Promise((ok) => document.getElementById('og').toBlob(ok, 'image/jpeg', 0.9));
  const r = await fetch('/__save/og.jpg', { method: 'POST', body: blob });
  return 'og.jpg: ' + (await r.text());
}
if (new URLSearchParams(location.search).has('auto')) {
  (async () => { const a = await draw(); const b = await save(); document.title = `done: ${a} / ${b}`; })();
}
</script></body></html>
