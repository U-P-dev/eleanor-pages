<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>og</title>
<style>body{margin:0;background:#ccc;font-family:sans-serif}canvas{display:block;margin:8px;box-shadow:0 0 0 1px #000;max-width:95vw;height:auto}</style></head><body>
<canvas id="og" width="1200" height="630"></canvas>
<script>
// SNS で共有されたときの画像（1200×630）。`await draw(); await save()` → tools/preview/out/og.jpg を public/ へ手で移す
// グラデーションは PNG だと 800KB を超えるので JPEG（品質 0.9）で書き出す
// 色は tokens.css と同じ（グラデーションは Magenta-900 → バイオレット → Blue-1000。どの点でも白い文字が 4.5:1 以上）
const FONT = '"BIZ UDPGothic", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif';

function mark(c, x, y, s) {
  // ロゴ（favicon.svg と同じ形）: 角丸の白地に紫の3本線
  const r = 8 * s;
  c.fillStyle = '#fff';
  c.beginPath(); c.roundRect(x, y, 32 * s, 32 * s, r); c.fill();
  c.fillStyle = '#5109ad';
  for (const [bx, by, bw] of [[9, 8, 14], [9, 14.4, 10], [9, 20.8, 14]]) {
    c.beginPath(); c.roundRect(x + bx * s, y + by * s, bw * s, 3.2 * s, 1.6 * s); c.fill();
  }
}

async function draw() {
  await document.fonts.ready;
  const c = document.getElementById('og').getContext('2d');
  const g = c.createLinearGradient(0, 0, 1200, 630);
  g.addColorStop(0, '#8b008b'); g.addColorStop(0.52, '#7c3aed'); g.addColorStop(1, '#00118f');
  c.fillStyle = g; c.fillRect(0, 0, 1200, 630);
  mark(c, 96, 84, 2.5);
  c.fillStyle = '#fff'; c.textBaseline = 'alphabetic';
  c.font = `700 44px ${FONT}`; c.fillText('エレノア', 192, 140);
  c.font = `700 104px ${FONT}`;
  c.fillText('「つくって終わり」。', 84, 330);
  c.fillText('に、しない。', 96, 450);
  c.font = `400 34px ${FONT}`;
  c.fillText('ホームページと LP の制作・運用｜東京・新宿', 100, 560);
  c.font = `700 30px ${FONT}`; c.textAlign = 'right'; c.fillText('eleanor-dev.com', 1104, 560);
  c.textAlign = 'left';
  return 'drawn';
}
async function save() {
  const blob = await new Promise((ok) => document.getElementById('og').toBlob(ok, 'image/jpeg', 0.9));
  const r = await fetch('/__save/og.jpg', { method: 'POST', body: blob });
  return 'og.jpg: ' + (await r.text());
}
</script></body></html>
